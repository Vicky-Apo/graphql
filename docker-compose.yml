version: '3.8'

services:
  web:
    build: .
    image: graphql-profile:latest
    ports:
      - "8081:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.project.name=graphql-profile"
      - "com.project.description=Zone01 GraphQL Profile"